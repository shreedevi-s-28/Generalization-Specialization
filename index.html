<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Generalization &amp; Specialization Visualizer · EER Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0a0d1a;--bg2:#0e1224;--panel:#131830;--panel2:#1a2040;--line:#28305a;--line2:#3a4479;
  --text:#e8eafb;--muted:#9aa3cf;--dim:#6c76a8;--accent:#7b7fff;--accent2:#b388ff;--accent-soft:rgba(123,127,255,.14);
  --ok:#3fd6a3;--warn:#ffc061;--bad:#ff6f91;--info:#5cc2ff;
  --canvas:#0b0f21;--grid:rgba(123,127,255,.10);--ent:#161c3b;--ent-head:#252e5e;--node-stroke:#5b64c4;
  --kw:#b388ff;--ty:#5cc2ff;--str:#ffc061;--cm:#6c76a8;
  --shadow:0 8px 28px rgba(0,0,0,.35);
  --f-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--f-body:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#f3f4fb;--bg2:#eceefa;--panel:#ffffff;--panel2:#f4f5ff;--line:#d9dcf0;--line2:#b9beea;
  --text:#191d3a;--muted:#525a8a;--dim:#7d86b3;--accent:#4f55e6;--accent2:#8a55e8;--accent-soft:rgba(79,85,230,.10);
  --ok:#0f9d72;--warn:#b7791f;--bad:#d6335f;--info:#1683c7;
  --canvas:#fbfbff;--grid:rgba(79,85,230,.10);--ent:#ffffff;--ent-head:#e4e6ff;--node-stroke:#5a61d8;
  --kw:#7a3ff0;--ty:#1683c7;--str:#a86400;--cm:#8a92bd;--shadow:0 8px 24px rgba(40,50,120,.12);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);line-height:1.2;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(28px,4.2vw,46px);font-weight:700}h2{font-size:24px;font-weight:650}h3{font-size:18px;font-weight:650}h4{font-size:15px;font-weight:650}
p{margin:0 0 .8em}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;background:var(--bg2);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--f-head);font-weight:700;font-size:17px;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none}
.nav a,.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--muted);background:none;border:0;cursor:pointer;text-align:left;font-size:14px}
.nav a:hover,.nav button:hover{background:var(--accent-soft);color:var(--text);text-decoration:none}
.nav a.on{background:var(--accent-soft);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side .sp{flex:1}
.top{display:none}
.main{padding:26px 30px 60px;max-width:1500px;width:100%;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h p{color:var(--muted);margin:0;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
.card.tight{padding:12px}.card h3{margin-bottom:.4em}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.ga{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}.sb{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.xs{font-size:12px}.mono{font-family:var(--f-mono)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;font-weight:500;font-size:14px;transition:background .15s,border-color .15s,transform .05s;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff}.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.xs{padding:3px 8px;font-size:12px}.btn.danger:hover{border-color:var(--bad);background:rgba(255,111,145,.12);color:var(--bad)}
.btn.ghost{background:none;border-color:transparent}.btn.ghost:hover{border-color:var(--line2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line2);color:var(--muted);background:var(--panel2);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:rgba(63,214,163,.4)}.chip.warn{color:var(--warn);border-color:rgba(255,192,97,.4)}.chip.bad{color:var(--bad);border-color:rgba(255,111,145,.4)}.chip.info{color:var(--info);border-color:rgba(92,194,255,.4)}.chip.acc{color:var(--accent);border-color:var(--accent)}
input[type=text],input[type=number],input[type=search],input:not([type]),select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;font-family:var(--f-mono);font-size:13px;line-height:1.5}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.ck{display:flex;align-items:center;gap:8px;cursor:pointer}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button:hover{color:var(--text)}.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--panel2);font-weight:600;color:var(--muted)}
.scroll-x{overflow-x:auto;max-width:100%}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:center;padding:26px 0 30px}
.hero h1{margin-bottom:.35em}.hero .sub{font-family:var(--f-head);font-size:clamp(18px,2.2vw,24px);color:var(--muted);margin-bottom:22px}
.hero .sub b{color:var(--text);font-weight:600}
.feat{display:flex;gap:12px}.feat .ico-b{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
/* diagram */
.viz{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.canvas-wrap{position:relative;background:var(--canvas);border:1px solid var(--line);border-radius:12px;overflow:hidden;height:min(66vh,640px);min-height:380px;touch-action:none}
.canvas-wrap.small{height:300px;min-height:0}
.canvas-wrap svg{width:100%;height:100%;display:block;cursor:grab;user-select:none}
.canvas-wrap svg.panning{cursor:grabbing}
.canvas-hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--dim);pointer-events:none}
.zoomctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px}
.zoomctl .btn{padding:4px 9px}
.insp{max-height:calc(66vh + 60px);overflow:auto}
.attr-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto auto auto;gap:4px;align-items:center;margin-bottom:5px}
.attr-row input,.attr-row select{padding:4px 6px;font-size:13px}
.attr-row label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center}
.node-ent .box{fill:var(--ent);stroke:var(--node-stroke);stroke-width:1.5}.node-ent .head{fill:var(--ent-head)}
.node-ent.sel .box,.node-ent.multi .box{stroke:var(--accent2);stroke-width:2.6}.node-ent.multi .box{stroke-dasharray:6 3}
.node-ent text{fill:var(--text);font-family:var(--f-body);font-size:13px}.node-ent .nm{font-weight:700;font-size:14px;font-family:var(--f-head)}
.node-ent .inh{fill:var(--dim);font-style:italic}.node-ent .ty{fill:var(--dim);font-size:11px;font-family:var(--f-mono)}
.node-rel polygon{fill:var(--ent);stroke:var(--node-stroke);stroke-width:1.5}.node-rel.sel polygon{stroke:var(--accent2);stroke-width:2.6}.node-rel text{fill:var(--text);font-size:12px;font-weight:600;text-anchor:middle}
.node-isa circle{fill:var(--ent);stroke:var(--accent2);stroke-width:1.8}.node-isa.sel circle{stroke-width:3;fill:var(--accent-soft)}.node-isa text{fill:var(--accent2);font-weight:700;font-size:15px;text-anchor:middle;font-family:var(--f-mono)}
.edge{stroke:var(--node-stroke);stroke-width:1.5;fill:none}.edge.isa{stroke:var(--accent2)}.lbl{fill:var(--warn);font-size:12px;font-weight:700;text-anchor:middle;font-family:var(--f-mono)}
.gridline{stroke:var(--grid);stroke-width:1}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .st{flex:1 1 130px;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);position:relative;cursor:pointer;transition:border-color .2s,background .2s,transform .2s}
.flow .st.on{border-color:var(--accent2);background:var(--accent-soft);transform:translateY(-2px)}
.flow .st b{display:block;font-size:13px}.flow .st span{font-size:12px;color:var(--muted)}.flow .ar{align-self:center;color:var(--dim)}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-family:var(--f-mono);font-size:13px;line-height:1.55;margin:0;max-height:460px;white-space:pre}
.kw{color:var(--kw);font-weight:600}.ty{color:var(--ty)}.str{color:var(--str)}.cm{color:var(--cm)}
.schema{font-family:var(--f-mono);font-size:13.5px;line-height:1.7}.schema .pk{text-decoration:underline;text-underline-offset:3px}.schema .fk{font-style:italic;color:var(--info)}
.note{border-left:3px solid var(--info);background:rgba(92,194,255,.08);padding:9px 12px;border-radius:0 8px 8px 0;font-size:13.5px;margin:8px 0}
.note.warn{border-color:var(--warn);background:rgba(255,192,97,.09)}.note.bad{border-color:var(--bad);background:rgba(255,111,145,.09)}.note.ok{border-color:var(--ok);background:rgba(63,214,163,.09)}
.learn{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.toc{position:sticky;top:16px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
.toc a{display:flex;gap:8px;padding:6px 8px;border-radius:7px;color:var(--muted);font-size:13.5px;align-items:center}.toc a:hover{background:var(--accent-soft);color:var(--text);text-decoration:none}.toc a.on{background:var(--accent-soft);color:var(--text)}
.toc .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);flex:none}.toc .st.ip{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}.toc .st.dn{background:var(--ok);border-color:var(--ok)}
.toc h4{font-size:12px;color:var(--dim);margin:14px 8px 4px;font-family:var(--f-body);font-weight:600}
.sec{margin:0 0 26px;scroll-margin-top:16px}.sec>h3{padding-bottom:6px;border-bottom:1px solid var(--line)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}.steps li{counter-increment:s;position:relative;padding:6px 0 6px 38px}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
ul.tight{margin:.3em 0 .8em;padding-left:1.2em}ul.tight li{margin:.25em 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;cursor:pointer;background:var(--panel2);width:100%;text-align:left}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);background:var(--accent-soft)}.opt.right{border-color:var(--ok);background:rgba(63,214,163,.12)}.opt.wrong{border-color:var(--bad);background:rgba(255,111,145,.12)}
.opt b{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:12px;flex:none}
.vid{display:flex;gap:12px}.vid .th{width:120px;aspect-ratio:16/9;border-radius:8px;background:linear-gradient(135deg,var(--panel2),var(--accent-soft));display:grid;place-items:center;color:var(--accent);flex:none;border:1px solid var(--line)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.gal figure{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}.gal img{width:100%;height:120px;object-fit:cover;display:block;cursor:zoom-in}.gal figcaption{padding:7px 9px;font-size:12.5px}
.modal-bg{position:fixed;inset:0;background:rgba(3,5,15,.7);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:var(--shadow)}.modal.wide{width:min(980px,100%)}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--info);padding:10px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:14px}.toast.ok{border-left-color:var(--ok)}.toast.error{border-left-color:var(--bad)}.toast.warn{border-left-color:var(--warn)}
.spin{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px}@keyframes sp{to{transform:rotate(360deg)}}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.steps-bar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.steps-bar span{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--dim)}.steps-bar span.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}.steps-bar span.done{color:var(--ok);border-color:rgba(63,214,163,.4)}
.sheet input{padding:4px 6px;border-radius:0;border:1px solid var(--line);min-width:96px;font-size:13px}.sheet th input{font-weight:600;background:var(--panel2)}.sheet td,.sheet th{padding:0;border:0}
.rev-item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:var(--panel2)}.rev-item.confirmed{border-color:rgba(63,214,163,.6)}.rev-item.rejected{opacity:.55;border-style:dashed}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.cw svg{width:100%;height:auto;display:block}
.stat{font-family:var(--f-head);font-size:30px;font-weight:700}
.searchbox{position:relative}.res a{display:flex;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text)}.res a:hover{background:var(--accent-soft);text-decoration:none}
details.acc{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel2)}details.acc summary{padding:10px 14px;cursor:pointer;font-weight:600}details.acc>div{padding:0 14px 12px}
@media (max-width:1100px){.viz{grid-template-columns:1fr}.insp{max-height:none}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px))}.side.open{transform:none;box-shadow:var(--shadow)}
  .top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
  .main{padding:18px 14px 50px}.hero{grid-template-columns:1fr}.learn{grid-template-columns:1fr}.toc{position:static;max-height:none}.g2,.g3,.g4{grid-template-columns:1fr}
  .canvas-wrap{height:60vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.top,.toasts{display:none}.shell{display:block}}

/* Profile & Academic Components */
.prof-header{display:grid;grid-template-columns:140px minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:650px){.prof-header{grid-template-columns:1fr;text-align:center;justify-items:center}}
.avatar-frame{width:130px;height:130px;border-radius:20px;overflow:hidden;border:2px solid var(--accent);background:var(--bg2);display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.avatar-frame img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-frame .fallback-avatar{width:100%;height:100%;display:grid;place-items:center;color:var(--accent);font-size:38px;font-weight:700;font-family:var(--f-head);background:linear-gradient(135deg,var(--panel2),var(--accent-soft))}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.meta-item{background:var(--bg);padding:8px 12px;border-radius:8px;border:1px solid var(--line)}
.meta-item b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.meta-item span{font-size:14px;color:var(--text);font-weight:600}

/* Contributors Page */
.contrib-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:28px}
@media (max-width:960px){.contrib-grid{grid-template-columns:1fr}}
.contrib-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;transition:border-color .2s,transform .2s}
.contrib-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.contrib-card .avatar-box{width:120px;height:120px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);margin-bottom:14px;background:var(--bg);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.contrib-card .avatar-box img{width:100%;height:100%;object-fit:cover;display:block}
.faculty-card{background:var(--panel);border:2px solid var(--accent2);border-radius:16px;padding:26px;max-width:580px;margin:0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:var(--shadow)}

<script>

/* IndexedDB: 'img' = topic diagram images, 'contrib' = contributor records (with photos) */
const IDB = {
  db: null,
  open() {
    if (IDB.db) return Promise.resolve(IDB.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB is not available in this browser.'));
      let r; try { r = indexedDB.open('dbl-images', 2); } catch (e) { return rej(e); }
      r.onupgradeneeded = () => {
        const d = r.result;   /* v1 -> v2 keeps the existing 'img' store and its data untouched */
        if (!d.objectStoreNames.contains('img')) d.createObjectStore('img', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('contrib')) d.createObjectStore('contrib', { keyPath: 'id' });
      };
      r.onsuccess = () => { IDB.db = r.result; IDB.db.onversionchange = () => { IDB.db.close(); IDB.db = null; }; res(r.result); };
      r.onblocked = () => rej(new Error('Image storage is being upgraded but another EER Lab tab is still open. Close the other tabs and reload.'));
      r.onerror = () => rej(r.error || new Error('Could not open image storage.'));
    });
  },
  async tx(mode, fn, store = 'img') {
    const db = await IDB.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode); const st = t.objectStore(store); const rq = fn(st);
      t.oncomplete = () => res(rq && rq.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Storage quota exceeded or write blocked.'));
    });
  },
  all(store = 'img') { return IDB.tx('readonly', s => s.getAll(), store).then(a => (a || []).sort((x, y) => (x.order ?? 0) - (y.order ?? 0))); },
  put(o, store = 'img') { return IDB.tx('readwrite', s => s.put(o), store); },
  del(id, store = 'img') { return IDB.tx('readwrite', s => s.delete(id), store); }
};

/* Toast + modal */
function toast(msg, kind = 'info', ms = 4200) {
  let box = $('.toasts'); if (!box) { box = document.createElement('div'); box.className = 'toasts'; box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; box.appendChild(t);
  setTimeout(() => t.remove(), ms);
}
function openModal(html, { wide = false, onClose } = {}) {
  closeModal();
  const bg = document.createElement('div'); bg.className = 'modal-bg'; bg.id = 'modal';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) closeModal(); });
  bg._onClose = onClose; document.body.appendChild(bg);
  const f = $('input,select,textarea,button', bg.firstChild); if (f && !f.dataset.act) f.focus();
  return bg.firstChild;
}
function closeModal() { const m = $('#modal'); if (m) { if (m._onClose) m._onClose(); m.remove(); } }
function confirmBox(msg, okLabel = 'Confirm', danger = true) {
  return new Promise(res => {
    openModal(`<h3>Please confirm</h3><p>${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cf-no">Cancel</button><button class="btn ${danger ? 'danger' : 'pri'}" id="cf-yes">${esc(okLabel)}</button></div>`, { onClose: () => res(false) });
    $('#cf-no').onclick = () => { res(false); closeModal(); };
    $('#cf-yes').onclick = () => { const m = $('#modal'); m._onClose = null; closeModal(); res(true); };
  });
}
function promptBox(title, label, value = '') {
  return new Promise(res => {
    openModal(`<h3>${esc(title)}</h3><label class="f">${esc(label)}<input id="pb-in" value="${esc(value)}"></label><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="pb-no">Cancel</button><button class="btn pri" id="pb-yes">OK</button></div>`, { onClose: () => res(null) });
    const done = () => { const v = $('#pb-in').value.trim(); const m = $('#modal'); m._onClose = null; closeModal(); res(v || null); };
    $('#pb-no').onclick = () => closeModal(); $('#pb-yes').onclick = done; $('#pb-in').onkeydown = e => { if (e.key === 'Enter') done(); };
  });
}

/* Action delegation */
const ACT = {}, INP = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (fn) { if (el.tagName === 'A' && !el.getAttribute('href')) e.preventDefault(); try { fn(el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, 'error'); } }
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el && INP[el.dataset.chg]) try { INP[el.dataset.chg](el, e); } catch (err) { console.error(err); toast('Something went wrong: ' + err.message, 'error'); } });
document.addEventListener('input', e => { const el = e.target.closest('[data-inp]'); if (el && INP[el.dataset.inp]) try { INP[el.dataset.inp](el, e); } catch (err) { console.error(err); } });

/* Files */
async function saveFile(filename, data, mimeNote = '') {
  let dl = null; try { dl = window.claude && await claude.use('downloads'); } catch (e) { }
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain' });
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('Saved ' + filename, 'ok'); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Save cancelled.', 'info'); return false; }
      if (e && e.code === 'rejected_extension' && /\.sql$/.test(filename)) { try { await dl.save({ filename: filename + '.txt', data: blob }); toast('This viewer only allows certain file types, so it was saved as ' + filename + '.txt — rename it to .sql.', 'warn', 7000); return true; } catch (e2) { } }
      toast('Could not save the file here (' + ((e && e.code) || 'error') + '). Use Copy instead.', 'error'); return false;
    }
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Download started: ' + filename, 'ok'); return true; }
  catch (e) { toast('Downloads are not available in this view. Use Copy instead.', 'error'); return false; }
}
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Copied to clipboard', 'ok'); } catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied to clipboard', 'ok'); } catch (e2) { toast('Copy is blocked here. Select the text and copy it manually.', 'error'); } ta.remove(); } }

/* AI (sample capability) */
let _sample; async function getSample() { if (_sample !== undefined) return _sample; try { _sample = window.claude ? await claude.use('sample') : null; } catch (e) { _sample = null; } return _sample; }
function aiErr(e) {
  const c = e && e.code;
  if (c === 'not_granted') return 'AI generation was declined. Allow it when prompted to generate questions.';
  if (c === 'rate_limited') return 'Too many AI requests right now. Wait a moment and try again.';
  if (c === 'invalid_json') return 'The AI reply could not be read as questions. Try again with fewer questions.';
  if (c === 'cancelled') return 'Stopped.';
  return 'AI generation failed (' + (c || 'error') + '). ' + ((e && e.message) || '');
}

/* Router */
const VIEWS = {}; let CUR = { name: '', args: [] }, MOUNT = null, CLEAN = null;

function route() {
  const h = (location.hash || '#/home').replace(/^#\/?/, ''); const [name, ...args] = h.split('/').map(decodeURIComponent);
  const view = VIEWS[name] ? name : 'home'; CUR = { name: view, args };
  if (CLEAN) { try { CLEAN(); } catch (e) { } CLEAN = null; }
  MOUNT = null; const out = $('#view');
  try { out.innerHTML = VIEWS[view](...args); } catch (err) { console.error(err); out.innerHTML = `<div class="card"><h3>This page could not be displayed</h3><p class="muted">${esc(err.message)}</p><a class="btn" href="#/home">Back to Home</a></div>`; }
  $$('.nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === view));
  $('#side').classList.remove('open'); window.scrollTo(0, 0);
  if (MOUNT) try { MOUNT(); } catch (err) { console.error(err); toast('Page error: ' + err.message, 'error'); }
}
function rerender() { const y = window.scrollY; const out = $('#view'); if (CLEAN) { try { CLEAN(); } catch (e) { } CLEAN = null; } MOUNT = null; out.innerHTML = VIEWS[CUR.name](...CUR.args); if (MOUNT) MOUNT(); window.scrollTo(0, y); }

/* YouTube helpers */
function getYouTubeId(url) {
  if (!url) return null;
  let s = String(url).trim(); if (!s) return null;
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = 'https://' + s;
  let u; try { u = new URL(s); } catch (e) { return null; }
  if (!/^https?:$/.test(u.protocol)) return null;
  const host = u.hostname.toLowerCase().replace(/^(www|m|music)\./, '');
  const ok = id => /^[A-Za-z0-9_-]{11}$/.test(id || '') ? id : null;
  if (host === 'youtu.be') return ok(u.pathname.split('/')[1]);
  if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
    const p = u.pathname.split('/').filter(Boolean);
    if (p[0] === 'watch') return ok(u.searchParams.get('v'));
    if (['embed', 'shorts', 'live', 'v'].includes(p[0])) return ok(p[1]);
  }
  return null;
}
const ytWatchUrl = id => 'https://www.youtube.com/watch?v=' + id;
/* Ask YouTube's public oEmbed endpoint whether a video exists and may be embedded.
   Returns {state:'ok'|'blocked'|'missing'|'unknown', title, author}. 'unknown' = could not reach YouTube (offline / CORS). */
async function ytCheck(id) {
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(ytWatchUrl(id)));
    if (r.status === 404) return { state: 'missing' };
    if (r.status === 401 || r.status === 403) return { state: 'blocked' };
    if (!r.ok) return { state: 'unknown' };
    const j = await r.json(); return { state: 'ok', title: j.title || '', author: j.author_name || '' };
  } catch (e) { return { state: 'unknown' }; }
}
function ytEmbedHTML(url, title = 'Video lecture') {
  const vid = getYouTubeId(url);
  if (!vid) {
    const safe = /^https?:\/\/\S+$/i.test(String(url || '').trim());
    return `<div class="note warn small"><b>This is not a recognised YouTube video link.</b> Supported: youtube.com/watch?v=…, youtu.be/…, youtube.com/embed/…, youtube.com/shorts/…${safe ? ` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open the link directly ↗</a>` : ''}</div>`;
  }
  const short = /\/shorts\//.test(String(url));
  return `<div class="yt-box${short ? ' short' : ''}" data-vid="${vid}">
    <div class="vid-embed-wrap yt-stage"><button type="button" class="yt-facade" data-act="yt-play" data-vid="${vid}" data-title="${esc(title)}" aria-label="Play video: ${esc(title)}"><img class="yt-thumb" src="https://i.ytimg.com/vi/${vid}/hqdefault.jpg" alt="" loading="lazy" referrerpolicy="no-referrer"><span class="yt-play" aria-hidden="true">▶</span></button></div>
    <div class="yt-msg xs"></div>
    <div class="xs" style="margin-top:2px"><a href="${ytWatchUrl(vid)}" target="_blank" rel="noopener noreferrer">Watch directly on YouTube ↗</a></div>
  </div>`;
}
ACT['yt-play'] = async el => {
  const box = el.closest('.yt-box'), vid = el.dataset.vid, title = el.dataset.title || 'Video lecture', msg = box.querySelector('.yt-msg');
  const direct = `<a href="${ytWatchUrl(vid)}" target="_blank" rel="noopener noreferrer">Watch it on YouTube ↗</a>`;
  if (location.protocol === 'file:') {
    msg.innerHTML = `<div class="note warn small">YouTube refuses to play embedded videos on pages opened straight from a file (file://). Serve the app over http (see README: <span class="mono">python -m http.server</span>) to play it here. ${direct}</div>`;
    window.open(ytWatchUrl(vid), '_blank', 'noopener'); return;
  }
  msg.innerHTML = '<span class="muted">Checking video…</span>';
  const c = await ytCheck(vid);
  if (c.state === 'missing') { msg.innerHTML = `<div class="note bad small">YouTube reports that this video no longer exists or is private. ${direct}</div>`; return; }
  if (c.state === 'blocked') { msg.innerHTML = `<div class="note warn small">The owner has disabled embedding for this video, so it cannot play inside this page. ${direct}</div>`; return; }

function inferPK(t) {
  if (t.pk && t.pk.length) return { cols: t.pk, conf: 'declared', note: `Declared in the SQL as PRIMARY KEY (${t.pk.join(', ')}).` };
  const n = t.rows.length, single = t.cols.filter(c => isUnique(t, [c])), idc = single.filter(isIdName);
  if (!n) { const c = t.cols.find(isIdName); return c ? { cols: [c], conf: 'possible', note: `There are no rows to test, so ${c} is suggested from its name only. Please confirm.` } : { cols: [], conf: 'none', note: 'Not enough information to determine a primary key: the table has no rows and no column looks like an identifier.' }; }

  if (pick) { const strong = n >= 3 && isIdName(pick); return { cols: [pick], conf: strong ? 'likely' : 'possible', note: `${pick} appears to uniquely identify each row (${n} of ${n} values are distinct).` + (n < 3 ? ' Only ' + n + ' row(s) were tested, so this is weak evidence.' : '') + (isIdName(pick) ? '' : ' The column name does not look like an identifier, so please check it.') }; }
  if (n >= 3) for (let i = 0; i < t.cols.length; i++) for (let j = i + 1; j < t.cols.length; j++) if (isUnique(t, [t.cols[i], t.cols[j]])) return { cols: [t.cols[i], t.cols[j]], conf: 'possible', note: `No single column is unique, but ${t.cols[i]} together with ${t.cols[j]} is. This could be a composite key.` };

function analyze(tables) {

  tables.forEach(t => { pkInfo[t.id] = inferPK(t); });
  const fkList = {};   // tid -> [{cols, refTid, refCols, src, conf, reason}]
  tables.forEach(t => {
    const list = [];
    if (t.source === 'sql') t.fks.forEach(f => { if (f.refTid) list.push({ cols: f.cols, refTid: f.refTid, refCols: f.refCols, src: 'sql', conf: 'likely', reason: `Declared in the SQL: FOREIGN KEY (${f.cols.join(', ')}) REFERENCES ${byId[f.refTid].name}.` }); });

        const byName = nrm(c) === nrm(p) && !GENERIC.has(nrm(c)), byTable = ['id', 'code', 'no', 'number'].some(sfx => nrm(c) === nrm(B.name) + sfx) && nrm(c) !== nrm(p);

        let reason = byName ? `Column ${c} has the same name as the key ${p} of ${B.name}.` : `Column ${c} looks like a reference to ${B.name}.`, conf = 'possible';
        if (t.rows.length && B.rows.length) { const bv = new Set(colVals(B, p).map(x => x.toLowerCase())), av = colVals(t, c).filter(Boolean); if (av.length && av.every(x => bv.has(x.toLowerCase()))) { conf = 'likely'; reason += ` All ${av.length} value(s) also appear in ${B.name}.${p}.`; } else if (av.length) reason += ` Some values do not appear in ${B.name}.${p}, so check the data.`; }

  tables.forEach(t => { const fl = (fkList[t.id] || []).filter(f => !isSubOf[t.id] || isSubOf[t.id].sup !== f.refTid); const pk = pkInfo[t.id].cols; const fcols = new Set(fl.flatMap(f => f.cols)); const nonfk = t.cols.filter(c => !fcols.has(c));

  tables.forEach(t => { const pk = pkInfo[t.id]; rev.entities.push({ tid: t.id, name: t.name, rows: t.rows.length, pkConf: pk.conf, pkNote: pk.note, attrs: t.cols.map(c => ({ name: c, type: inferType(t, c), pk: pk.cols.includes(c), nn: !!t.nn[c] || pk.cols.includes(c), include: true })) }); });

  tables.forEach(t => (fkList[t.id] || []).forEach(f => {

    const B = byId[f.refTid], pk = pkInfo[t.id].cols, unique = f.cols.every(c => pk.length === 1 && pk[0] === c) || (f.cols.length === 1 && (t.uq[f.cols[0]] || (t.source !== 'sql' && isUnique(t, f.cols) && t.rows.length >= 3)));

  const claimed = new Set();
  Object.entries(groups).forEach(([sup, subs]) => { subs.forEach(s => claimed.add(s.tid)); claimed.add(sup); rev.isas.push({ id: uid('is'), kind: 'structural', superName: byId[sup].name, superTid: sup, subs: subs.map(s => s.tid), common: [], keyName: '', dropKeys: true, disjoint: true, total: false, status: 'detected', conf: subs.every(s => s.conf === 'likely') ? 'likely' : 'possible', reason: subs[0].reason + (subs.length > 1 ? ` The same pattern appears in ${subs.length} tables.` : ''), assumed: true }); });
  /* common-attribute ISA candidates */

  const nonKey = t => t.cols.filter(c => !keyish(t).has(c));

  for (let i = 0; i < cand.length; i++) for (let j = i + 1; j < cand.length; j++) { const a = nonKey(cand[i]), bn = new Set(nonKey(cand[j]).map(nrm)); const com = a.filter(c => bn.has(nrm(c))); if (com.length >= 2) pairs.push({ i: cand[i], j: cand[j], com }); }

  });

  tables.forEach(t => t.cols.forEach(c => { if (keyish(t).has(c) || !/dept|department|course|branch|category|company|project|team|city/i.test(c) || tables.some(x => nrm(x.name) === nrm(c))) return; const v = colVals(t, c).filter(Boolean); if (v.length >= 2 && new Set(v.map(x => x.toLowerCase())).size < v.length) rev.hints.push(`Column "${c}" in ${t.name} has repeated values (${[...new Set(v)].slice(0, 3).join(', ')}). If ${c} has details of its own, model it as a separate entity and add a relationship. Add a second table for it to try that.`); }));
  if (tables.length === 1) rev.notes.push('Only one table was provided, so relationships and superclass structures cannot be inferred. Add more tables to detect them.');
  return rev;
}

function buildModel(rev, tables, title) {
  const m = newModel(title || 'Imported model'), warnings = [], byT = {}, tById = Object.fromEntries(tables.map(t => [t.id, t]));
  const okMn = rev.mns.filter(x => x.status === 'confirmed'), junction = new Set(okMn.map(x => x.tid));
  const okRel = rev.rels.filter(r => r.status === 'confirmed' && !junction.has(r.fkTid)), okIsa = rev.isas.filter(x => x.status === 'confirmed');
  const dropCols = {}; okRel.forEach(r => { (dropCols[r.fkTid] = dropCols[r.fkTid] || new Set()); r.cols.forEach(c => dropCols[r.fkTid].add(c)); });
  rev.entities.forEach(re => { if (junction.has(re.tid) || re.include === false) return; const attrs = re.attrs.filter(a => a.include && !(dropCols[re.tid] && dropCols[re.tid].has(a.name) && !a.pk)).map(a => attr(a.name, a.type, (a.pk ? 'pk|' : '') + (a.nn ? 'nn' : ''))); byT[re.tid] = addEntity(m, re.name.toUpperCase(), attrs); });

    const subs = g.subs.filter(t => byT[t] && !subDone.has(t)); if (subs.length < g.subs.length) warnings.push(`Some tables in the ${g.superName} group already belong to another confirmed group and were skipped.`); if (!subs.length) return;
    let sup;
    if (g.kind === 'structural') { sup = byT[g.superTid]; if (!sup) return; subs.forEach(t => { const e = byT[t]; e.attrs = e.attrs.filter(a => !(g.dropKeys && a.pk)); }); m.isas.push({ id: uid('i'), superId: sup.id, subIds: subs.map(t => byT[t].id), disjoint: g.disjoint, total: g.total, x: null, y: null }); }
    else { const lifted = g.common.filter(c => c.checked).map(c => c.name); sup = generalize(m, subs.map(t => byT[t].id), g.superName || 'SUPERCLASS', lifted, g.keyName || 'ID', g.dropKeys); const isa = m.isas[m.isas.length - 1]; isa.disjoint = g.disjoint; isa.total = g.total; }
    subs.forEach(t => subDone.add(t));
  });
  okRel.forEach(r => { const A = byT[r.a], B = byT[r.b]; if (!A || !B) { warnings.push(`Relationship ${r.name} was skipped because one of its tables is missing.`); return; } m.rels.push({ id: uid('r'), name: r.name, ends: [{ entity: A.id, card: r.ca, part: r.pa }, { entity: B.id, card: r.cb, part: r.pb }], attrs: [], identifying: false, x: 0, y: 0 }); });

  layout(m); return { model: m, warnings };
}

class RecogError extends Error { constructor(code, message) { super(message); this.code = code; } }

const VISION_MAX_BYTES = 8e6, VISION_MAX_EDGE = 1568;
const VISION_TYPES = { 'image/png': 'PNG', 'image/jpeg': 'JPG', 'image/webp': 'WebP' };

/* Real format from the first bytes (the browser-reported MIME type and the extension can both be wrong). */
async function sniffImageType(file) {
  const b = new Uint8Array(await file.slice(0, 16).arrayBuffer());
  if (b[0] === 0x89 && b[1] === 0x50 && b[2] === 0x4e && b[3] === 0x47) return 'image/png';
  if (b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff) return 'image/jpeg';
  if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46 && b[8] === 0x57 && b[9] === 0x45 && b[10] === 0x42 && b[11] === 0x50) return 'image/webp';
  if (b[0] === 0x25 && b[1] === 0x50 && b[2] === 0x44 && b[3] === 0x46) return 'application/pdf';
  return '';
}
/* Validate an uploaded file. Returns {ok:true,type} or {ok:false,msg}. */
async function validateDiagramFile(f) {
  let type = '';
  try { type = await sniffImageType(f); } catch (e) { return { ok: false, msg: 'The file could not be read from disk. Try selecting it again.' }; }
  if (type === 'application/pdf') return { ok: true, type, pdf: true };
  if (!VISION_TYPES[type]) return { ok: false, msg: 'This is not a PNG, JPG or WebP image (its contents do not match). Export the diagram as one of those formats.' };
  if (f.size > VISION_MAX_BYTES) return { ok: false, msg: `The image is ${(f.size / 1e6).toFixed(1)} MB. The limit is 8 MB. Save a smaller copy.` };
  if (f.size < 1500) return { ok: false, msg: 'The file is too small to be a diagram.' };
  return { ok: true, type };
}
/* Decode, downscale to at most 1568px on the long edge (the size vision models work best at) and return base64. */
function prepareImage(file, type) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(url); rej(new RecogError('read_failed', 'The browser could not decode this image. It may be corrupt. Re-export it and try again.')); };
    img.onload = () => {
      URL.revokeObjectURL(url);
      const w = img.naturalWidth, h = img.naturalHeight;
      if (w < 120 || h < 120) return rej(new RecogError('unreadable', `The image is only ${w}×${h}px, too small to read any text from. Use a larger export.`));
      const k = Math.min(1, VISION_MAX_EDGE / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0, 0, cw, ch); cx.drawImage(img, 0, 0, cw, ch);
      const out = cv.toDataURL('image/png'); /* lossless: keeps thin lines and small text legible */
      let b64 = out.split(',')[1];
      if (b64.length * 0.75 > 4.8e6) { b64 = cv.toDataURL('image/jpeg', 0.9).split(',')[1]; return res({ b64, media: 'image/jpeg', w: cw, h: ch, origW: w, origH: h }); }
      res({ b64, media: 'image/png', w: cw, h: ch, origW: w, origH: h });
    };
    img.src = url;
  });
}

    r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal,
      headers: { 'content-type': 'application/json', 'x-api-key': VISION.cfg.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({
        model: VISION.cfg.model || VISION_DEFAULT_MODEL, max_tokens: 6000, temperature: 0, system: VISION_SYSTEM,
        messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: img.media, data: img.b64 } }, { type: 'text', text: VISION_PROMPT }] }]
      })
    });
  } catch (e) {
    if (e && e.name === 'AbortError') throw new RecogError('cancelled', 'Stopped.');
    throw new RecogError('network', 'Could not reach api.anthropic.com. Check your internet connection (and that no ad-blocker or network filter blocks it), then try again.');
  }
  let body = null; try { body = await r.json(); } catch (e) { }
  if (!r.ok) {
    const m = (body && body.error && body.error.message) || ('HTTP ' + r.status);
    if (r.status === 401 || r.status === 403) throw new RecogError('auth', 'The Anthropic API rejected the saved API key (' + m + '). Check the key in the recognition settings.');
    if (r.status === 404) throw new RecogError('model', 'The model "' + (VISION.cfg.model || VISION_DEFAULT_MODEL) + '" was not found for this key. Change the model name in the recognition settings.');
    if (r.status === 429) throw new RecogError('rate_limited', 'Too many requests or the key has no remaining quota. Wait a moment, or check your Anthropic billing/limits.');
    if (r.status === 413) throw new RecogError('too_large', 'The API says the image is too large. Use a smaller export.');
    if (r.status === 529 || r.status >= 500) throw new RecogError('overloaded', 'The Anthropic API is temporarily overloaded or down (' + m + '). Try again in a minute.');
    throw new RecogError('api', 'The Anthropic API returned an error: ' + m);
  }
  const txt = ((body && body.content) || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
  if (!txt) throw new RecogError('bad_response', 'The AI returned an empty reply' + (body && body.stop_reason === 'refusal' ? ' (it declined to process the image).' : '.'));
  return { data: parseVisionJSON(txt), truncated: body.stop_reason === 'max_tokens' };
}

const vStr = x => (x == null ? '' : String(x)).trim();
/* Turn the raw model JSON into a clean structure, enforcing the "do not invent" rules. */
function normalizeVision(d) {
  if (!d || typeof d !== 'object') throw new RecogError('bad_response', 'The AI reply had an unexpected shape.');
  if (d.isErDiagram === false) throw new RecogError('not_er', 'This image was not recognised as an ER/EER diagram.' + (d.reason ? ' ' + vStr(d.reason) : ''));
  if (d.readable === false) throw new RecogError('unreadable', 'The diagram could not be read.' + (d.reason ? ' ' + vStr(d.reason) : ' Try a larger or sharper image.'));
  const tri = v => (v === true || v === false) ? v : null;
  const seen = new Set();
  const entities = (Array.isArray(d.entities) ? d.entities : []).map(e => ({
    name: vStr(e && e.name), weak: tri(e && e.weak), uncertain: !!(e && e.uncertain),
    attributes: (Array.isArray(e && e.attributes) ? e.attributes : []).map(a => (typeof a === 'string' ? { name: a } : a || {})).map(a => ({ name: vStr(a.name), key: a.key === true, partialKey: a.partialKey === true, derived: a.derived === true, multivalued: a.multivalued === true, uncertain: !!a.uncertain })).filter(a => a.name)
  })).filter(e => { const k = e.name.toLowerCase(); if (!e.name || seen.has(k)) return false; seen.add(k); return true; });
  if (!entities.length) throw new RecogError('unreadable', 'No entities could be read from this image. It may not be an ER/EER diagram or may be too unclear.');
  const card = v => (v === '1' || v === 1) ? '1' : (v === 'N' || v === 'M' || v === 'n' || v === 'm' || v === '*') ? 'N' : null;
  const names = new Set(entities.map(e => e.name.toLowerCase()));
  const relationships = (Array.isArray(d.relationships) ? d.relationships : []).map(r => ({ name: vStr(r && r.name), a: vStr(r && r.a), b: vStr(r && r.b), cardA: card(r && r.cardA), cardB: card(r && r.cardB), totalA: tri(r && r.totalA), totalB: tri(r && r.totalB), uncertain: !!(r && r.uncertain) })).filter(r => names.has(r.a.toLowerCase()) && names.has(r.b.toLowerCase()) && r.a.toLowerCase() !== r.b.toLowerCase());
  const isas = (Array.isArray(d.isas) ? d.isas : []).map(g => ({ superclass: vStr(g && g.superclass), subclasses: (Array.isArray(g && g.subclasses) ? g.subclasses : []).map(vStr).filter(s => names.has(s.toLowerCase())), disjoint: tri(g && g.disjoint), total: tri(g && g.total), uncertain: !!(g && g.uncertain) })).filter(g => names.has(g.superclass.toLowerCase()) && g.subclasses.length);
  const dropped = (Array.isArray(d.relationships) ? d.relationships.length : 0) - relationships.length + (Array.isArray(d.isas) ? d.isas.length : 0) - isas.length;
  const uncertain = (Array.isArray(d.uncertain) ? d.uncertain : []).map(vStr).filter(Boolean);
  if (dropped > 0) uncertain.push(`${dropped} relationship/specialization item(s) referred to entity names that are not in the entity list and were left out.`);
  return { entities, relationships, isas, uncertain };
}

/* Main entry point. Returns {result, provider, model, img} or throws RecogError. */
async function recognizeDiagram(file, signal) {
  const cap = await visionCapability();
  if (!cap.ok) throw new RecogError('unavailable', cap.why);
  const v = await validateDiagramFile(file);
  if (!v.ok) throw new RecogError('read_failed', v.msg);
  if (v.pdf) throw new RecogError('read_failed', 'PDFs cannot be read here. Export the diagram as PNG, JPG or WebP.');
  const img = await prepareImage(file, v.type);
  let raw, truncated = false;
  if (cap.provider === 'claude-runtime') {
    const s = await getSample();
    try { raw = await s.json(VISION_SYSTEM + '\n\n' + VISION_PROMPT, { images: file, signal }); }
    catch (e) {
      if (e && e.code === 'cancelled') throw new RecogError('cancelled', 'Stopped.');
      if (e && e.code === 'not_granted') throw new RecogError('unavailable', 'Permission to send the image to Claude was declined.');
      throw new RecogError(e && e.code === 'invalid_json' ? 'bad_response' : 'api', aiErr(e));
    }
  } else { const r = await callAnthropic(img, signal); raw = r.data; truncated = r.truncated; }
  const result = normalizeVision(raw);
  if (truncated) result.uncertain.push('The AI reply was cut off because the diagram is large. Some items at the end may be missing.');
  return { result, provider: cap.label, img: { w: img.origW, h: img.origH } };
}

/* The first release seeded six videos (ids v1-v6) whose YouTube IDs do not exist. They are removed once, together with
   any completion flag stored for them. Videos added by the user are never touched. */
const LEGACY_BAD_VIDEOS = { v1: '0kP0K4Z3_wM', v2: 'kYvjD_40qNk', v3: 'wXjRz6H8G6Q', v4: 'QZ0_7E6n1aE', v5: '3r_T2eZ1xG0', v6: 'vV3rX1_4E6w' };

function initSeeds() {
  if (!DB.cq || !DB.cq.length) {
    DB.cq = clone(SEED_CQ);
    DB.save('cq');
  }
  if (!DB.videos || !DB.videos.length) {
    DB.videos = clone(SEED_VIDEOS);
    DB.save('videos');
    return;
  }
  const dead = DB.videos.filter(v => LEGACY_BAD_VIDEOS[v.id] && getYouTubeId(v.url) === LEGACY_BAD_VIDEOS[v.id]);
  if (dead.length) {
    const ids = new Set(dead.map(v => v.id));
    DB.videos = DB.videos.filter(v => !ids.has(v.id));
    SEED_VIDEOS.forEach(sv => { if (!DB.videos.some(v => v.id === sv.id)) DB.videos.push(clone(sv)); });
    if (DB.vdone) ids.forEach(id => delete DB.vdone[id]);
    DB.save('videos'); DB.save('vdone');
  }
}

  mist: ['Creating the superclass but leaving duplicate common attributes in subclasses.', 'Generalizing entities that only share a name, not a meaning.', 'Confusing generalization with specialization (direction).', 'Keeping separate keys in the subclasses instead of inheriting the superclass key.'],
  exam: { defs: ['Generalization: bottom-up; combining entities into a higher-level entity.', 'Also called abstraction: hides differences, shows commonality.'], freq: ['Direction of generalization', 'Attributes that move to the superclass', 'Relation between generalization and specialization'], traps: ['"Generalization is top-down" is false.', 'Specific attributes are NOT moved to the superclass.'], pat: ['"Which process combines entity types into a super type?"', '"Bottom-up refinement is called …"'], short: ['Define generalization with an example.', 'Why is generalization used?'], long: ['Explain generalization with an EER diagram and map it to relational tables.'], gate: ['Generalization removes attribute redundancy by pulling common attributes into a superclass.'], net: ['Generalization is one of the abstraction mechanisms (with aggregation and classification).'], univ: ['Draw an EER diagram showing generalization of two entity types.'] },

  sum: 'Generalization = bottom-up: extract common attributes into a superclass. Subclasses keep only what is specific.', next: 'specialization'

  beg: 'Read it aloud: "STUDENT is a PERSON". The circle is the small hinge that connects the general box to the specific boxes.',
  why: 'ISA is what makes EER different from ER. It is the symbol that carries inheritance and the constraints.',
  how: ['Draw a line from the superclass to a circle.', 'Draw lines from the circle to each subclass, with a subset symbol (⊂) facing the superclass.', 'Write d or o inside the circle.', 'Use a double line from the superclass for total, a single line for partial.'],
  terms: [['ISA circle', 'Holds the d/o letter.'], ['Subset symbol ⊂', 'Shows that the subclass is a subset of the superclass.'], ['Double line', 'Total specialization.'], ['Alternative notation', 'Hollow-headed arrow pointing to the superclass (Silberschatz).']],
  widget: 'cw', pipe: 'vehicle', real: 'A VEHICLE registry: the circle says d (a vehicle is not both), and the double line says every vehicle is a car or a bike.',

  quiz: [Q('The letter "o" in the ISA circle means:', ['Optional', 'Overlapping', 'Owner', 'One'], 1, 'o = overlapping.'), Q('A double line from superclass to the circle means:', ['Total', 'Partial', 'Weak', 'Disjoint'], 0, 'Double line = total.'), Q('Which describes ISA?', ['Ordinary M:N relationship', 'Subclass-of relationship', 'Foreign key', 'Attribute'], 1, 'ISA connects subclass to superclass.')],

const CW = {};

  <circle cx="${c1}" cy="82" r="${r}" style="fill:rgba(123,127,255,.18);stroke:var(--accent);stroke-width:1.5"/><circle cx="${c2}" cy="82" r="${r}" style="fill:rgba(179,136,255,.18);stroke:var(--accent2);stroke-width:1.5"/>
  <text x="${c1 - (d ? 0 : 22)}" y="150" text-anchor="middle" style="fill:var(--accent);font-size:11px;font-weight:600">STUDENT</text><text x="${c2 + (d ? 0 : 22)}" y="150" text-anchor="middle" style="fill:var(--accent2);font-size:11px;font-weight:600">FACULTY</text>

}

/* Convert a validated recognition result into the workbench review structure. Nothing touches the Visualizer model here. */
function recogToReview(res, provider) {
  const tabs = res.entities.map(e => {
    const seen = new Set(), attrs = e.attributes.filter(a => { const k = a.name.toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
    const t = newTable(e.name, attrs.map(a => a.name), []); if (!t.cols.length) t.cols = ['ID'];
    t.source = 'image'; t.fks = []; t.pk = attrs.filter(a => a.key).map(a => a.name); if (!t.pk.length) t.pk = null; t._unc = e.uncertain; t._attrUnc = new Set(attrs.filter(a => a.uncertain).map(a => a.name)); return t;
  });
  const byName = n => tabs.find(t => t.name.toLowerCase() === String(n || '').toLowerCase());
  const rev = { source: 'image', entities: [], rels: [], mns: [], isas: [], hints: [], notes: ['Read from your image by ' + provider + '. It may contain mistakes. Compare with the original before confirming.'] };
  tabs.forEach(t => rev.entities.push({ tid: t.id, name: t.name, rows: 0, include: true, unc: !!t._unc, pkConf: t.pk ? 'likely' : 'none', pkNote: t.pk ? 'Key attribute(s) marked in the image: ' + t.pk.join(', ') + '.' : 'No key attribute was marked in the image.', attrs: t.cols.map(c => ({ name: c, type: 'VARCHAR(100)', pk: !!(t.pk && t.pk.includes(c)), nn: !!(t.pk && t.pk.includes(c)), include: true, unc: t._attrUnc.has(c) })) }));
  res.relationships.forEach(r => {
    const A = byName(r.a), B = byName(r.b), miss = [];
    if (r.cardA == null || r.cardB == null) miss.push('cardinality');
    if (r.totalA == null || r.totalB == null) miss.push('participation (total/partial)');
    rev.rels.push({ id: uid('rl'), fkTid: A.id, cols: [], refCols: [], a: A.id, b: B.id, ca: r.cardA === '1' ? '1' : 'N', cb: r.cardB === '1' ? '1' : 'N', pa: r.totalA ? 'total' : 'partial', pb: r.totalB ? 'total' : 'partial', name: (r.name || 'Relates').replace(/\s+/g, '_'), status: 'detected', unc: r.uncertain, note: miss.length ? 'Not shown in the image: ' + miss.join(' and ') + '. A default is filled in. Please set it yourself.' : '', reason: 'Read from the image.' });
  });
  res.isas.forEach(g => {
    const S = byName(g.superclass), subs = g.subclasses.map(byName).filter(Boolean);
    rev.isas.push({ id: uid('is'), kind: 'structural', superName: S.name, superTid: S.id, subs: subs.map(x => x.id), common: [], keyName: '', dropKeys: true, disjoint: g.disjoint == null ? true : g.disjoint, total: g.total == null ? false : g.total, assumedD: g.disjoint == null, assumedT: g.total == null, status: 'detected', unc: g.uncertain, reason: 'Read from the image: ' + S.name + ' is specialized into ' + subs.map(x => x.name).join(', ') + '.' });
  });
  (res.uncertain || []).forEach(x => rev.notes.push('Unclear in image: ' + x));
  return { tabs, rev };
}
ACT['wb-imgai'] = async () => {
  if (WB.imgBusy || !WB.imgFile) return;

let QZ = null;

  QZ = { kind, title, qs, back: back || '/practice', meta: meta || {}, i: 0, ans: qs.map(() => null), qt: qs.map(() => 0), t0: Date.now(), qs0: Date.now(), done: false }; go('/quiz');
}
const qzTick = () => { const a = $('#qz-total'), b = $('#qz-q'); if (!QZ || !a) return; a.textContent = fmtT((Date.now() - QZ.t0) / 1000); b.textContent = fmtT(QZ.qt[QZ.i] + (Date.now() - QZ.qs0) / 1000); };
function qzLeave() { if (QZ) { QZ.qt[QZ.i] += (Date.now() - QZ.qs0) / 1000; QZ.qs0 = Date.now(); } }
VIEWS.quiz = () => {
  if (!QZ || QZ.done) return `<div class="empty">No quiz is currently running. <a href="#/practice">Go to Quiz</a> or <a href="#/competitive">attempt Competitive Questions</a>.</div>`;
  const q = QZ.qs[QZ.i], sel = QZ.ans[QZ.i], iv = setInterval(qzTick, 1000); CLEAN = () => clearInterval(iv);
  const badge = QZ.kind === 'cq' 
    ? `<span class="marks-chip">+${q.marks || 2} Marks</span> <span class="chip info">${esc(q.src || 'Competitive Problem')}</span>`
    : `<span class="chip">${esc(q.src || 'Practice bank')}</span>`;
  return `<div class="page-h"><div><h2>${esc(QZ.title)}</h2><p>Question ${QZ.i + 1} of ${QZ.qs.length}${q.marks ? ` · Value: ${q.marks} Marks` : ''}</p></div><div class="row"><span class="chip">Total <b id="qz-total">0:00</b></span><span class="chip">This question <b id="qz-q">0:00</b></span><button class="btn sm danger" data-act="qz-quit">Quit</button></div></div>
  <div class="bar" style="margin-bottom:14px"><i style="width:${pct(QZ.ans.filter(x => x != null).length, QZ.qs.length)}%"></i></div>
  <div class="card" style="max-width:820px"><div class="row" style="margin-bottom:8px">${badge}${q.topic && topicById(q.topic) ? `<span class="chip">${esc(topicById(q.topic).t)}</span>` : ''}</div><h3>${esc(q.q)}</h3>${q.model ? staticSVG(modelOf(q.model)) : ''}${q.o.map((o, i) => `<button class="opt ${sel === i ? 'sel' : ''}" data-act="qz-pick" data-i="${i}" aria-pressed="${sel === i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}
  <div class="row sb" style="margin-top:12px"><div class="row"><button class="btn" data-act="qz-go" data-d="-1" ${QZ.i === 0 ? 'disabled' : ''}>Previous</button><button class="btn" data-act="qz-skip">Skip</button></div><div class="row">${QZ.i + 1 < QZ.qs.length ? `<button class="btn pri" data-act="qz-go" data-d="1">Next</button>` : ''}<button class="btn ${QZ.i + 1 < QZ.qs.length ? '' : 'pri'}" data-act="qz-submit">Submit quiz</button></div></div></div><div class="row" style="margin-top:12px;max-width:820px">${QZ.qs.map((_, i) => `<button class="btn xs ${i === QZ.i ? 'on' : ''}" data-act="qz-jump" data-i="${i}" title="${QZ.ans[i] == null ? 'Unanswered' : 'Answered'}" style="${QZ.ans[i] != null ? 'border-color:var(--ok)' : ''}">${i + 1}</button>`).join('')}</div>`;
};
ACT['qz-pick'] = el => { QZ.ans[QZ.i] = +el.dataset.i; const y = scrollY; rerender(); scrollTo(0, y); };
ACT['qz-go'] = el => { qzLeave(); QZ.i += +el.dataset.d; rerender(); }; ACT['qz-jump'] = el => { qzLeave(); QZ.i = +el.dataset.i; rerender(); };
ACT['qz-skip'] = () => { qzLeave(); QZ.ans[QZ.i] = null; if (QZ.i + 1 < QZ.qs.length) QZ.i++; rerender(); };
ACT['qz-quit'] = async () => { if (await confirmBox('Quit this quiz? Your answers will not be saved.', 'Quit')) { const b = QZ.back; QZ = null; go(b); } };
ACT['qz-submit'] = async () => {
  const un = QZ.ans.filter(x => x == null).length; if (un && !(await confirmBox(`${un} question(s) are unanswered and will count as skipped. Submit?`, 'Submit', false))) return;
  qzLeave(); const total = (Date.now() - QZ.t0) / 1000; let correct = 0, wrong = 0, skipped = 0;
  let totalMarks = 0, marksObtained = 0;
  QZ.qs.forEach((q, i) => {
    const m = q.marks || 2;
    totalMarks += m;
    const a = QZ.ans[i];
    if (a == null) {
      skipped++;
    } else {
      const ok = a === q.a;
      if (ok) { correct++; marksObtained += m; } else { wrong++; }
      recordAnswer(q.id || (QZ.kind + ':' + i), q.topic || 'eer-model', ok, QZ.qt[i]);
    }
  });

/* Read a photo, check it really is PNG/JPG/WebP, crop to a square and shrink so storage stays small. */
async function ctReadPhoto(file) {
  const t = await sniffImageType(file);
  if (!VISION_TYPES[t]) throw new Error('Choose a PNG, JPG or WebP photo.');
  if (file.size > 6e6) throw new Error('The photo is larger than 6 MB. Choose a smaller one.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('The photo could not be decoded. It may be corrupt.')); i.src = url; });
    const side = Math.min(img.naturalWidth, img.naturalHeight), out = Math.min(480, side), cv = document.createElement('canvas'); cv.width = cv.height = out;
    cv.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
    return cv.toDataURL('image/jpeg', 0.88);
  } finally { URL.revokeObjectURL(url); }
}

}

  if (!name) return toast('Enter the contributor\'s name.', 'warn');
  if (!role) return toast('Enter the contributor\'s role.', 'warn');
  try {
    const all = await IDB.all('contrib'), old = AD.ct;
    const rec = { id: old ? old.id : uid('ct'), kind: $('#ct-kind').value, name, role, regNo: $('#ct-reg').value.trim(), dept: $('#ct-dept').value.trim(), desc: $('#ct-desc').value.trim(), photo: AD.ctPhoto !== undefined ? AD.ctPhoto : (old ? old.photo || '' : ''), order: old ? old.order : (all.reduce((m, c) => Math.max(m, c.order ?? 0), 0) + 1) };
    await IDB.put(rec, 'contrib');
    toast(old ? 'Contributor updated.' : 'Contributor added.', 'ok'); AD.ct = null; AD.ctPhoto = undefined; rerender();
  } catch (e) { toast('Could not save the contributor: ' + (e.message || 'storage error') + (/quota/i.test(e.message || '') ? ' Try a smaller photo.' : ''), 'error', 7000); }

ACT['ct-del'] = async el => {
  if (!(await confirmBox('Delete this contributor and their photo?', 'Delete'))) return;
  try { await IDB.del(el.dataset.id, 'contrib'); if (AD.ct && AD.ct.id === el.dataset.id) AD.ct = null; rerender(); } catch (e) { toast('Could not delete: ' + e.message, 'error'); }
};
ACT['ct-move'] = async el => {
  try {
    const all = await IDB.all('contrib'), me = all.find(c => c.id === el.dataset.id); if (!me) return;
    const same = all.filter(c => (c.kind || 'other') === (me.kind || 'other')), j = same.indexOf(me) + +el.dataset.d, other = same[j]; if (!other) return;
    /* give every record a distinct order first (older records may not have one), then swap the two */
    all.forEach((c, i) => { c.order = i + 1; }); const t = me.order; me.order = other.order; other.order = t;
    await Promise.all(all.map(c => IDB.put(c, 'contrib'))); ctAdminList();
  } catch (e) { toast('Could not reorder: ' + e.message, 'error'); }
};

  const url = $('#av-url').value.trim(), vid = getYouTubeId(url), topic = $('#av-topic').value; let title = $('#av-title').value.trim(), channel = $('#av-ch').value.trim();
  if (!topic) return toast('Please select a topic.', 'warn');
  if (!vid) return toast('That is not a YouTube video link. Use youtube.com/watch?v=…, youtu.be/…, youtube.com/embed/… or youtube.com/shorts/….', 'error', 6000);
  const dup = DB.videos.find(v => getYouTubeId(v.url) === vid && v.id !== (AD.vid && AD.vid.id));
  if (dup) return toast('This video is already in the list ("' + dup.title + '").', 'warn');
  toast('Checking the video with YouTube…', 'info', 2000);
  const chk = await ytCheck(vid);
  if (chk.state === 'missing') return toast('YouTube says this video does not exist or is private. It was not added.', 'error', 7000);
  if (chk.state === 'blocked' && !(await confirmBox('The owner has disabled embedding for this video. It will show a thumbnail and a "Watch directly on YouTube" link instead of a player. Add it anyway?', 'Add anyway', false))) return;
  if (chk.state === 'ok') { title = title || chk.title; channel = channel || chk.author; }
  if (!title) return toast('Please enter a title (it could not be fetched automatically).', 'warn');
  const rec = { id: (AD.vid && AD.vid.id) || uid('v'), topic, title, url: ytWatchUrl(vid), channel, duration: $('#av-dur').value.trim(), desc: $('#av-desc').value.trim() };
  if (AD.vid) DB.videos = DB.videos.map(v => v.id === rec.id ? rec : v); else DB.videos.push(rec);
  DB.save('videos');
  toast(chk.state === 'ok' ? 'Video verified and saved.' : chk.state === 'unknown' ? 'Saved, but YouTube could not be reached to verify it (offline?).' : 'Video lecture saved.', chk.state === 'ok' ? 'ok' : 'warn');

};

function cqCheck(x) {
  const e = [];
  const y = +x.year;
  if (!(y >= 1990 && y <= 2100)) e.push('year is invalid');
  if (!topicById(x.topic)) e.push('topic is invalid');
  if (!['easy', 'medium', 'hard'].includes(x.d)) e.push('difficulty must be easy, medium, or hard');
  if (!String(x.q || '').trim()) e.push('question statement is required');
  if (!Array.isArray(x.o) || x.o.length !== 4 || x.o.some(o => !String(o).trim())) e.push('four non-empty options are required');
  if (!(Number.isInteger(x.a) && x.a >= 0 && x.a < 4)) e.push('correct option must be 0-3');
  return e;
}

/* Read the Add/Edit form (also used by Preview, so unsaved text can be previewed). */
function acRead() {
  return {
    id: (AD.cq && AD.cq.id) || uid('cq'),
    exam: $('#ac-exam').value, year: +$('#ac-year').value, topic: $('#ac-topic').value, d: $('#ac-d').value,
    marks: Math.max(1, +$('#ac-marks').value || 2), timeLimit: Math.max(30, +$('#ac-tlimit').value || 90),
    q: $('#ac-q').value.trim(), o: [0, 1, 2, 3].map(i => $('#ac-o' + i).value.trim()), a: +$('#ac-a').value,
    source: $('#ac-src').value.trim() || 'Curated Competitive Question', sol: $('#ac-sol').value.trim(),
    added: (AD.cq && AD.cq.added) || Date.now()
  };
}
ACT['ac-save'] = () => {
  if (!$('#ac-ver').checked) return toast('Please check the verification confirmation box.', 'warn');
  const x = acRead(), e = cqCheck(x);
  if (e.length) return toast('Cannot save: ' + e[0], 'error');
  if (AD.cq) DB.cq = DB.cq.map(q => q.id === x.id ? x : q);
  else DB.cq.push(x);
  DB.save('cq');
  AD.cq = null;
  toast('Competitive question saved.', 'ok');
  rerender();
};

/* Admin preview: same cqCardHTML the student page uses. Modes: Answer key (answer + explanation shown) / Student view. */
const PV = { list: [], i: 0, mode: 'key', open: false, warns: [] };
function pvHTML() {
  const q = PV.list[PV.i], issues = cqCheck(q), n = PV.list.length;
  return `<div class="pv-banner"><div><span class="chip warn">Admin preview</span> <span class="small muted">${n > 1 ? `Question ${PV.i + 1} of ${n}` : 'Not shown to students in this form'}</span></div>
    <div class="row"><button class="btn xs ${PV.mode === 'key' ? 'on' : ''}" data-act="pv-mode" data-m="key">Answer key</button><button class="btn xs ${PV.mode === 'student' ? 'on' : ''}" data-act="pv-mode" data-m="student">Student view</button>${n > 1 ? `<button class="btn xs" data-act="pv-nav" data-d="-1" ${PV.i === 0 ? 'disabled' : ''}>← Prev</button><button class="btn xs" data-act="pv-nav" data-d="1" ${PV.i === n - 1 ? 'disabled' : ''}>Next →</button>` : ''}<button class="btn xs" data-act="closemodal">Close</button></div></div>
    ${PV.warns.length ? `<div class="note warn small"><b>Skipped from this preview:</b> ${PV.warns.map(esc).join('; ')}</div>` : ''}
    ${issues.length ? `<div class="note bad small"><b>This question cannot be saved yet:</b> ${issues.map(esc).join('; ')}.</div>` : ''}
    ${cqCardHTML(q, { idx: PV.i, key: PV.mode === 'key', open: PV.open, solAct: 'pv-sol' })}
    <p class="xs muted">${PV.mode === 'key' ? 'The green highlight and explanation are visible to admins only. Students see them only after pressing “View Detailed Explanation”.' : 'This is what a student sees: no answer is revealed until they open the explanation.'}</p>`;
}
function pvOpen(list, i = 0, warns = []) {
  if (!list.length) return toast('There is nothing to preview.', 'warn');
  Object.assign(PV, { list, i, mode: 'key', open: false, warns });
  openModal(`<div id="pv-body">${pvHTML()}</div>`, { wide: true });
}
const pvDraw = () => { const b = $('#pv-body'); if (b) b.innerHTML = pvHTML(); };
ACT['pv-mode'] = el => { PV.mode = el.dataset.m; PV.open = false; pvDraw(); };
ACT['pv-nav'] = el => { PV.i = Math.max(0, Math.min(PV.list.length - 1, PV.i + +el.dataset.d)); PV.open = false; pvDraw(); };
ACT['pv-sol'] = () => { PV.open = !PV.open; pvDraw(); };

ACT['ac-preview-json'] = () => {
  let arr; try { arr = JSON.parse($('#ac-json').value); if (!Array.isArray(arr)) throw 0; } catch (e) { return toast('Paste a valid JSON array of questions first.', 'error'); }
  const ok = [], warns = [];
  arr.forEach((x, i) => { const e = cqCheck(x || {}); if (e.length) warns.push(`#${i + 1}: ${e[0]}`); else ok.push(cqNormalize(x, 'p' + i)); });
  if (!ok.length) return toast('None of the questions in the JSON are valid: ' + (warns[0] || 'empty array'), 'error', 7000);
  pvOpen(ok, 0, warns);
};
/* One normaliser for imported JSON: used by import and by Preview JSON so both treat the data identically. */
function cqNormalize(x, id) {
  return { id: id || uid('cq'), exam: x.exam || 'GATE CS', year: +x.year || 2024, topic: x.topic, d: x.d || 'medium', marks: +x.marks || 2, timeLimit: +x.timeLimit || 90, q: String(x.q).trim(), o: x.o.map(String), a: x.a, source: String(x.source || 'Imported'), sol: String(x.sol || x.e || ''), added: Date.now() };
}

ACT['ac-import'] = () => {
  let arr;
  try { arr = JSON.parse($('#ac-json').value); if (!Array.isArray(arr)) throw 0; }
  catch (e) { return toast('Invalid JSON array.', 'error'); }
  let added = 0; const bad = [];
  arr.forEach((x, i) => {
    const e = cqCheck(x || {});
    if (e.length) bad.push(`#${i + 1}: ${e[0]}`);
    else {
      DB.cq.push(cqNormalize(x));
      added++;
    }
  });
  DB.save('cq');
  toast(`Imported ${added} question(s).` + (bad.length ? ` Skipped ${bad.length}` : ''), bad.length ? 'warn' : 'ok');
  rerender();
};

ACT['bk-import'] = () => $('#bk-file').click();
INP['bk-file'] = el => {
  const f = el.files[0]; el.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o.progress !== 'object') throw 0;
      if (!(await confirmBox('Replace current data with this backup file?', 'Import', false))) return;
      ['profile', 'settings', 'progress', 'attempts', 'pstats', 'tagg', 'videos', 'vdone', 'resources', 'cq', 'extras'].forEach(k => {
        if (o[k] !== undefined) { DB[k] = o[k]; DB.save(k); }
      });
      if (Array.isArray(o.contributors)) { try { for (const c of await IDB.all('contrib')) await IDB.del(c.id, 'contrib'); for (const c of o.contributors) if (c && c.id && c.name) await IDB.put(c, 'contrib'); } catch (e) { toast('Contributors in the backup could not be restored: ' + e.message, 'warn'); } }
      toast('Backup imported successfully.', 'ok');
      rerender();
    } catch (e) { toast('Invalid backup file format.', 'error'); }
  };
  r.readAsText(f);
};

/* ---------- Search ---------- */
function searchIndex() {
  const ix = [];
  TOPICS.forEach(t => ix.push({ k: 'Topic', t: t.t, s: t.what, h: '/learn/' + t.id, x: (t.t + ' ' + t.what + ' ' + (t.terms || []).map(a => a[0]).join(' ')).toLowerCase() }));
  EXAMPLES.forEach(e => ix.push({ k: 'Example', t: e.title, s: e.problem, h: '/examples/' + e.id, x: (e.title + ' ' + e.problem + ' ' + e.tag).toLowerCase() }));
  PRACTICE.forEach(p => ix.push({ k: 'Quiz', t: p.q, s: TYPES_P[p.type] || 'Practice', h: '/practice/' + p.topic, x: (p.q + ' ' + p.o.join(' ')).toLowerCase() }));
  (DB.videos || []).forEach(v => ix.push({ k: 'Video', t: v.title, s: v.channel || '', h: '/progress', x: (v.title + ' ' + (v.desc || '')).toLowerCase() }));
  [...SEED_RESOURCES, ...DB.resources].forEach(r => ix.push({ k: 'Resource', t: r.title, s: r.desc || '', h: '/help', x: (r.title + ' ' + (r.desc || '')).toLowerCase() }));
  (DB.cq || []).forEach(q => ix.push({ k: 'Competitive', t: q.q.slice(0, 90), s: `${q.exam || 'GATE'} ${q.year || ''} (${q.d || 'medium'})`, h: '/competitive', x: q.q.toLowerCase() }));
  ix.push({ k: 'Page', t: 'Student Profile', s: 'Laboratory profile, identity, and performance', h: '/profile', x: 'student profile avatar record' });
  ix.push({ k: 'Page', t: 'Contributors', s: 'Student developers and faculty mentor', h: '/contributors', x: 'contributors team students faculty mentor' });
  return ix;
}

ACT.search = () => {
  openModal(`<div class="searchbox"><label class="sr" for="sq">Search</label><input id="sq" type="search" data-inp="sq" placeholder="Search topics, questions, competitive problems, videos…" autocomplete="off"></div><div id="sres" class="res" style="margin-top:10px;max-height:60vh;overflow:auto"><p class="small muted">Type to search. Try "generalization", "disjoint", or "competitive".</p></div>`);
  $('#sq').focus();
};

INP.sq = el => {
  const q = el.value.trim().toLowerCase(), box = $('#sres');
  if (!q) { box.innerHTML = '<p class="small muted">Type to search.</p>'; return; }
  const toks = q.split(/\s+/), res = searchIndex().map(i => ({ i, sc: toks.every(t => i.x.includes(t)) ? (i.t.toLowerCase().includes(q) ? 3 : 1) : 0 })).filter(r => r.sc).sort((a, b) => b.sc - a.sc).slice(0, 25);
  box.innerHTML = res.length ? res.map(({ i }) => `<a href="#${i.h}" data-act="closemodal"><span class="chip acc">${i.k}</span><span><b>${esc(i.t)}</b><br><span class="small muted">${esc((i.s || '').slice(0, 90))}</span></span></a>`).join('') : `<div class="empty">No results for "${esc(el.value)}".</div>`;
};

  if (typeof initSeeds === 'function') initSeeds();
  applyTheme();

  window.addEventListener('hashchange', route);

}
